[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The repo root is published, so keep source and SQL files from being served as pages.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# Private dashboard pages: never cached, indexed or framed by other sites.
[[headers]]
  for = "/pro/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
